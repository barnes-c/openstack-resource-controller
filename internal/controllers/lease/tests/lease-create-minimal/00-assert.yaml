---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Lease
metadata:
  name: lease-create-minimal
status:
  resource:
    name: lease-create-minimal
    status: ACTIVE
  conditions:
  - type: Available
    status: "True"
    reason: Success
  - type: Progressing
    status: "False"
    reason: Success
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Lease
      name: lease-create-minimal
      ref: lease
assertAll:
    - celExpr: "lease.status.id != ''"
    - celExpr: "size(lease.status.resource.reservations) == 1"
    - celExpr: "lease.status.resource.reservations[0].resourceType == 'virtual:instance'"
    # Blazar names the reserved flavor after the reservation
    - celExpr: "lease.status.resource.reservations[0].flavorID == lease.status.resource.reservations[0].id"
