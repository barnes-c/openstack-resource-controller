---
apiVersion: openstack.k-orc.cloud/v1alpha1
kind: Lease
metadata:
  name: lease-create-host
status:
  resource:
    name: lease-create-host
    status: PENDING
---
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
resourceRefs:
    - apiVersion: openstack.k-orc.cloud/v1alpha1
      kind: Lease
      name: lease-create-host
      ref: lease
assertAll:
    - celExpr: "lease.status.id != ''"
    - celExpr: "size(lease.status.resource.reservations) == 1"
    - celExpr: "lease.status.resource.reservations[0].resourceType == 'physical:host'"
    - celExpr: "lease.status.resource.reservations[0].id != ''"
    # Host reservations have no flavor or server group
    - celExpr: "!has(lease.status.resource.reservations[0].flavorID)"
